name: Update README with latest Substack posts

on:
  schedule:
    # Runs once a day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest Substack posts and update README
        run: |
          python3 - <<'PYEOF'
          import json
          import re
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          feed_url = "https://vianielson.substack.com/feed"
          api_url = (
              "https://api.rss2json.com/v1/api.json?"
              + urllib.parse.urlencode({"rss_url": feed_url})
          )

          try:
              with urllib.request.urlopen(api_url, timeout=30) as resp:
                  payload = json.load(resp)
              if payload.get("status") != "ok":
                  raise RuntimeError(f"rss2json returned status={payload.get('status')}")
              items = payload.get("items", [])[:5]
              if not items:
                  raise RuntimeError("no items returned")
          except (urllib.error.URLError, urllib.error.HTTPError, RuntimeError, TimeoutError) as e:
              print(f"::warning::Skipping README update, feed service unavailable: {e}")
              sys.exit(0)

          lines = []
          for item in items:
              title = (item.get("title") or "").strip()
              link = (item.get("link") or "").strip()
              pubdate = (item.get("pubDate") or "").strip()
              lines.append(f"- [{title}]({link}) — {pubdate}")

          block = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"(<!-- BLOG-POST-LIST:START -->).*?(<!-- BLOG-POST-LIST:END -->)",
              lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update latest Substack posts"
          git push
