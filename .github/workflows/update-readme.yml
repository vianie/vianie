name: Update README with latest Substack posts

on:
  schedule:
    # Runs once a day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Fetch latest Substack posts and update README
        run: |
          python3 - <<'PYEOF'
          import json
          import re
          import sys
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          FEED_URL = "https://vianielson.substack.com/feed"
          BROWSER_UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/124.0.0.0 Safari/537.36"
          )


          def via_rss2json():
              api_url = (
                  "https://api.rss2json.com/v1/api.json?"
                  + urllib.parse.urlencode({"rss_url": FEED_URL})
              )
              with urllib.request.urlopen(api_url, timeout=20) as resp:
                  payload = json.load(resp)
              if payload.get("status") != "ok":
                  raise RuntimeError(f"status={payload.get('status')}")
              items = []
              for item in payload.get("items", [])[:5]:
                  items.append(
                      (
                          (item.get("title") or "").strip(),
                          (item.get("link") or "").strip(),
                          (item.get("pubDate") or "").strip(),
                      )
                  )
              if not items:
                  raise RuntimeError("no items")
              return items


          def via_direct():
              req = urllib.request.Request(FEED_URL, headers={"User-Agent": BROWSER_UA})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read()
              root = ET.fromstring(data)
              items = []
              for entry in root.findall("./channel/item")[:5]:
                  items.append(
                      (
                          (entry.findtext("title") or "").strip(),
                          (entry.findtext("link") or "").strip(),
                          (entry.findtext("pubDate") or "").strip(),
                      )
                  )
              if not items:
                  raise RuntimeError("no items")
              return items


          def via_allorigins():
              proxied = "https://api.allorigins.win/raw?url=" + urllib.parse.quote(FEED_URL, safe="")
              req = urllib.request.Request(proxied, headers={"User-Agent": BROWSER_UA})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read()
              root = ET.fromstring(data)
              items = []
              for entry in root.findall("./channel/item")[:5]:
                  items.append(
                      (
                          (entry.findtext("title") or "").strip(),
                          (entry.findtext("link") or "").strip(),
                          (entry.findtext("pubDate") or "").strip(),
                      )
                  )
              if not items:
                  raise RuntimeError("no items")
              return items


          STRATEGIES = [via_rss2json, via_direct, via_allorigins]

          items = None
          errors = []
          for strategy in STRATEGIES:
              for attempt in range(2):
                  try:
                      items = strategy()
                      break
                  except Exception as e:
                      errors.append(f"{strategy.__name__} attempt {attempt + 1}: {e}")
                      time.sleep(3)
              if items:
                  break

          if not items:
              print("::warning::Skipping README update, all feed sources failed: " + " | ".join(errors))
              sys.exit(0)

          block = "\n".join(f"- [{title}]({link}) — {pubdate}" for title, link, pubdate in items)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"(<!-- BLOG-POST-LIST:START -->).*?(<!-- BLOG-POST-LIST:END -->)",
              lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update latest Substack posts"
          git push
