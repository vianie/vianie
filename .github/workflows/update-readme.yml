name: Update README with latest Substack posts

on:
  schedule:
    # Runs once a day at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Substack posts and update README
        run: |
          python3 - <<'PYEOF'
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          url = "https://vianielson.substack.com/feed"
          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) "
                      "Chrome/124.0.0.0 Safari/537.36"
                  )
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = resp.read()

          root = ET.fromstring(data)
          items = root.findall("./channel/item")[:5]

          lines = []
          for item in items:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              pubdate = (item.findtext("pubDate") or "").strip()
              lines.append(f"- [{title}]({link}) — {pubdate}")

          block = "\n".join(lines)

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          new_content = re.sub(
              r"(<!-- BLOG-POST-LIST:START -->).*?(<!-- BLOG-POST-LIST:END -->)",
              lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}",
              content,
              flags=re.DOTALL,
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update latest Substack posts"
          git push
